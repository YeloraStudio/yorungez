name: yorungez
services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: yorungez
      POSTGRES_DB: yorungez
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/Initialize-LocalEnvironment.ps1}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yorungez -d yorungez"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/Initialize-LocalEnvironment.ps1}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    ports: ["127.0.0.1:${REDIS_PORT:-16379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - "127.0.0.1:${SMTP_PORT:-1029}:1025"
      - "127.0.0.1:${MAILPIT_PORT:-8029}:8025"
volumes:
  postgres-data:
  redis-data:
