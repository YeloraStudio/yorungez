<rect x="594" y="104" width="522" height="452" rx="8" fill="#ffffff" stroke="#b5bbc2"/>
<text x="616" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#20252b" dominant-baseline="hanging">Tarih ve saat</text>
