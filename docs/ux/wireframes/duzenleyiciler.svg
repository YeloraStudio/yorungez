<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="590" viewBox="0 0 1140 590" role="img" aria-labelledby="title desc">
<title id="title">yorungez konum ve zaman düzenleyicileri</title><desc id="desc">Solda geçersiz enlem örneği ve alan hatası; sağda tarih/saat, saat dilimi bağlamı ve iptal/uygula eylemleri. Sayılar varsayılan konum değildir.</desc>
<rect width="1140" height="590" fill="#ffffff"/>
<text x="24" y="19" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#20252b" dominant-baseline="hanging">Konum ve zaman düzenleyicileri</text>
<text x="24" y="59" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#59616a" dominant-baseline="hanging">Düşük ayrıntılı akış taslağı · aynı anda açılan iki pencereyi temsil etmez</text>
<rect x="24" y="104" width="522" height="452" rx="8" fill="#ffffff" stroke="#b5bbc2"/>
<text x="46" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#20252b" dominant-baseline="hanging">Koordinat gir</text>
