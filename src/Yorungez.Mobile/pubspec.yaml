name: yorungez
description: "Yorungez: an advertising-free astronomy application for Android and iOS."
publish_to: 'none'
version: 0.1.0+6

environment:
  sdk: ^3.11.4

dependencies:
  audio_session: ^0.2.4
  camera: ^0.12.0+2
  crypto: ^3.0.8
  dio: ^5.11.1
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  url_launcher: 6.3.3
  flutter_riverpod: ^3.3.2
  geolocator: ^14.1.2
  go_router: ^17.5.0
  intl: ^0.20.2
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  timezone: 0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  shaders:
    - shaders/cosmic_sky.frag
  assets:
    - assets/generated/
    - assets/generated/images/
    - assets/generated/sky-art/
