name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Application, science and publication checks. The repository is public, so
  # the whole git history is scanned for leaked secrets before anything else.
  gate:
    uses: YeloraStudio/.github/.github/workflows/dotnet-gate.yml@v1
    with:
      global-json-file: global.json
      node-version: "22.20.0"
      python-version: "3.12"
      secret-scan: true
      timeout-minutes: 40
      commands: |
        python scripts/check_publication.py
        python scripts/verify_docs.py
        pwsh ./scripts/Verify-Backend.ps1
        pwsh ./scripts/Verify-Web.ps1
        npm ci --prefix tools/science-js --ignore-scripts --no-fund --no-audit
        pwsh ./scripts/Verify-Science.ps1 -Offline

  # Builds both production images and starts them with the production compose
  # file on the runner: private initializer, migrations, health endpoints.
  # Runs next to the gate so the two do not add up.
  containers:
    uses: YeloraStudio/.github/.github/workflows/dotnet-gate.yml@v1
    with:
      global-json-file: global.json
      timeout-minutes: 25
      commands: |
        bash scripts/Verify-Containers.sh

  # Only main publishes images. Pull requests (including forks, which get no
  # secrets) are covered by the container smoke test above.
  build:
    needs: [gate, containers]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: YeloraStudio/.github/.github/workflows/docker-build.yml@v1
    secrets: inherit
    with:
      # The build context is the repository root for both images: the Web
      # image stages the catalogue from data/ during the build.
      images: >-
        [{"ecr":"yorungez-api","context":".","file":"deploy/Dockerfile.api"},
         {"ecr":"yorungez-web","context":".","file":"deploy/Dockerfile.web"}]

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: YeloraStudio/.github/.github/workflows/compose-deploy.yml@v1
    secrets: inherit
    with:
      deploy-path: /home/yelora-dev/compose-projects/cnonestudio.com/yorungez
      # This repository owns the compose file. It lands next to the server's
      # private .env, which compose only reads from the compose file's folder.
      sync: deploy/compose.production.yaml
      sync-strip-components: 1
      compose-file: compose.production.yaml
      # postgres and redis are left running. migrate runs on every deploy as a
      # dependency of api, and api only starts after it exits 0.
      services: "api web"
      # `up -d` waits for api to be healthy before starting web, so api is
      # already up here; this checks the public route through Traefik.
      post-up: |
        curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
          -o /dev/null https://api.yorungez.com/health/ready
      health-url: https://yorungez.com/
