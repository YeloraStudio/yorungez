name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push on main must not kill a deployment halfway through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  containers:
    name: Production containers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and smoke test isolated production containers
        run: bash scripts/Verify-Containers.sh
  publication:
    name: Publication safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/check_publication.py
      - run: python scripts/verify_docs.py
      - name: Verify pinned Gitleaks and scan history
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          trap 'rm -rf -- "$tool_dir"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz             --output "$tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$tool_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" git . --redact --no-banner
  application:
    name: Application and science
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Backend integration tests with disposable local infrastructure
        shell: pwsh
        run: ./scripts/Verify-Backend.ps1
      - name: Client tests, types and production PWA build
        shell: pwsh
        run: ./scripts/Verify-Web.ps1
      - name: Install locked scientific probe
        working-directory: tools/science-js
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Frozen scientific references and cross-port parity
        shell: pwsh
        run: ./scripts/Verify-Science.ps1 -Offline
      - name: Remove this ephemeral runner's infrastructure
        if: always()
        run: docker compose down --volumes --remove-orphans

  # Publishing and deployment. This repository is public, so:
  # - Secrets live in the `production` environment, which only protected
  #   branches can use. Pull requests (forks included) never reach them.
  # - No third-party action touches a secret: the AWS CLI, ssh and scp are on
  #   the runner already.
  # - The AWS account id and the ECR token are masked; the server address is a
  #   secret and therefore masked too, so the origin behind Cloudflare stays
  #   out of the public log.
  build:
    name: Build ${{ matrix.image }} image
    needs: [containers, publication, application]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    env:
      AWS_REGION: us-east-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$account"
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          echo "REGISTRY=$registry" >> "$GITHUB_ENV"
      - name: Build and push yorungez-${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker buildx create --use --name ci >/dev/null
          repo="$REGISTRY/yorungez-$IMAGE"
          # The commit tag is what a rollback pins; latest is what the server
          # compose file reads. Layer cache lives next to the image in ECR.
          docker buildx build . --pull --push --provenance=false \
            --file "deploy/Dockerfile.$IMAGE" \
            --tag "$repo:$GITHUB_SHA" --tag "$repo:latest" \
            --cache-from "type=registry,ref=$repo:buildcache" \
            --cache-to "type=registry,ref=$repo:buildcache,mode=max,image-manifest=true,oci-mediatypes=true"
      - name: Log out of ECR
        if: always()
        run: docker logout "${REGISTRY:-none}" >/dev/null 2>&1 || true

  deploy:
    name: Deploy to production
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://yorungez.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-2
      DEPLOY_PATH: /home/yelora-dev/compose-projects/yorungez
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The host key is pinned from a secret: no trust-on-first-use on a fresh
      # runner, and a changed key stops the deployment instead of continuing.
      - name: Prepare SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host production
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
          CONFIG
      # The server keeps the master compose file (deploy/compose.yml is its copy);
      # this job does not write it, nor the server's .env and private/.
      - name: Pull and restart api and web
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$account"
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          # The token goes over stdin, never as an argument: it does not show
          # up in the server's process list. It expires within 12 hours and the
          # server logs out at the end either way.
          aws ecr get-login-password \
            | ssh production "docker login --username AWS --password-stdin '$registry' >/dev/null"
          # postgres and redis stay up. migrate shares the api image and runs as
          # api's dependency; api only starts after it exits 0, web only after
          # api is healthy.
          ssh production "DEPLOY_PATH='$DEPLOY_PATH' REGISTRY='$registry' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          trap 'docker logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT
          dc() { docker compose "$@"; }
          for attempt in 1 2 3; do
            dc pull api web && break
            [ "$attempt" = 3 ] && { echo "pull failed 3 times"; exit 1; }
            sleep 5
          done
          dc up -d api web
          dc ps --all
          docker image prune -f >/dev/null 2>&1 || true
          REMOTE
      # Called from the runner, so the whole public path is tested:
      # Cloudflare, Traefik, certificate and container.
      - name: Health check through the public route
        run: |
          set -euo pipefail
          for url in https://api.yorungez.com/health/ready https://yorungez.com/ https://www.yorungez.com/; do
            code=""
            for attempt in $(seq 1 20); do
              code=$(curl -sL -o /dev/null -w '%{http_code}' "$url" || true)
              [ "$code" = 200 ] && { echo "$url 200 (attempt $attempt)"; break; }
              sleep 6
            done
            [ "$code" = 200 ] || { echo "::error::$url did not return 200 (last: $code)"; exit 1; }
          done
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
